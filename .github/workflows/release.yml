name: Publish plugin release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build plugin
        run: dotnet build -c Release
      - name: Run settlement and regression tests
        run: dotnet run --project tests/ArkoviaEconomy.Tests.csproj -c Release
      - name: Run marketplace web smoke tests
        run: node tests/marketplace_web_smoke.js
      - name: Build marketplace service
        run: dotnet build services/ArkoviaMarketplace/ArkoviaMarketplace.csproj -c Release
      - name: Prepare release files
        run: |
          mkdir -p release-dist
          cp bin/Release/net9.0/ArkoviaEconomy.dll release-dist/ArkoviaEconomy.dll
          (cd release-dist && sha256sum ArkoviaEconomy.dll > ArkoviaEconomy.dll.sha256)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-dist/ArkoviaEconomy.dll \
            release-dist/ArkoviaEconomy.dll.sha256 \
            --title "Arkovia Economy ${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease
