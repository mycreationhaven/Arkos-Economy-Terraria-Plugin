name: Build and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build -c Release
      - run: dotnet run --project tests/ArkoviaEconomy.Tests.csproj -c Release
      - run: dotnet build services/ArkoviaSigner/ArkoviaSigner.csproj -c Release
      - run: python3 tests/signer_smoke.py
      - run: dotnet publish services/ArkoviaSigner/ArkoviaSigner.csproj -c Release -o signer-dist
      - uses: actions/upload-artifact@v4
        with:
          name: ArkoviaEconomy
          path: bin/Release/net9.0/ArkoviaEconomy.dll
      - uses: actions/upload-artifact@v4
        with:
          name: ArkoviaSigner
          path: signer-dist/
